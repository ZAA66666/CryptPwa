name: Build Android APK

# 触发方式：
#  1) 推送 main 分支 → 自动构建 release（正式自签名）APK
#  2) 在 Actions 页手动运行 → 可选择 release / debug
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型：release=正式自签名（推荐） / debug=调试'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (Capacitor 8 要求 Node>=22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Capacitor 8 编译要求 Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor deps
        run: |
          npm ci || npm install

      - name: Sync web assets into Android project
        run: |
          npm run sync

      - name: Determine build type (push 默认 release)
        id: bt
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ -z "$BT" ]; then BT="release"; fi
          echo "BT=$BT" >> "$GITHUB_OUTPUT"
          echo "构建类型: $BT"

      - name: Restore signing keystore (from Actions secret)
        env:
          P12_B64: ${{ secrets.CRYPTPWA_P12 }}
        run: |
          if [ -n "$P12_B64" ]; then
            echo "$P12_B64" | base64 -d > android/app/cryptpwa-release.p12
            echo "keystore restored from secret"
          else
            echo "::warning::CRYPTPWA_P12 secret not set — signing will fail"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          BT="${{ steps.bt.outputs.BT }}"
          if [ "$BT" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Tag & Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          BT="${{ steps.bt.outputs.BT }}"
          VER="$(grep -o 'APP_VERSION = "[^"]*"' js/i18n.js | head -1 | sed 's/.*"\([^"]*\)"$/\1/' || echo '1.0.0')"
          APK_SRC="android/app/build/outputs/apk/$BT/app-$BT.apk"
          APK_NAME="CryptPwa_${VER}_${BT}.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::APK not found: $APK_SRC"
            find android/app/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          cp "$APK_SRC" "$APK_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$APK_NAME" \
            --title "CryptPwa $TAG" \
            --notes "CryptPwa $VER（$BT 构建，自签名，允许未知来源即可安装）。构建时间：$(date -u +'%Y-%m-%d %H:%M UTC')。由 GitHub Actions 自动生成。"

name: Gradle Only Test (on push, no checkout)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore signing (no checkout)
        env:
          P12_B64: ${{ secrets.CRYPTPWA_P12 }}
        run: |
          if [ -n "$P12_B64" ]; then echo "have keystore"; else echo "no keystore"; fi
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptPwa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

name: Keystore Step Test (isolate secret env step)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "before"
      - name: Restore signing keystore
        env:
          P12_B64: ${{ secrets.CRYPTPWA_P12 }}
        run: |
          if [ -n "$P12_B64" ]; then
            echo "$P12_B64" | base64 -d > android/app/cryptpwa-release.p12
            echo "keystore restored"
          else
            echo "::warning::no keystore secret"
          fi
      - run: echo "after"

name: Build APK - Back (compile)

on:
  workflow_run:
    workflows: [ "Build APK - Front (sync web assets)" ]
    types: [ completed ]

permissions:
  actions: read

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download synced android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android
          run-id: ${{ github.event.workflow_run.id }}

      - name: Restore signing keystore
        env:
          P12_B64: ${{ secrets.CRYPTPWA_P12 }}
        run: |
          if [ -n "$P12_B64" ]; then
            echo "$P12_B64" | base64 -d > android/app/cryptpwa-release.p12
            echo "keystore restored"
          else
            echo "::warning::CRYPTPWA_P12 secret not set -- signing will fail"
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptPwa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

name: Build Android APK

# 触发方式：
#  1) 推送 main 分支 → 自动构建 release（正式自签名）APK
#  2) 在 Actions 页手动运行 → 可选择 release / debug
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型：release=正式自签名（推荐） / debug=调试'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (Capacitor 8 要求 Node>=22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Capacitor 8 编译要求 Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor deps
        run: |
          npm ci || npm install

      - name: Sync web assets into Android project
        run: |
          npm run sync
          npx cap sync android

      - name: Run static & algorithm tests
        run: |
          node scripts/tests/consistency.cjs
          node scripts/tests/smoke.cjs

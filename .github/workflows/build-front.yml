name: Build APK - Front (sync web assets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps and sync Capacitor
        run: |
          npm ci || npm install
          npm run sync
          npx cap sync android

      - name: Upload android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android/
